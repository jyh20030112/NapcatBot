services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    network_mode: bridge

    # 固定 MAC，尽量减少 QQ 登录状态异常变化
    mac_address: 02:42:ac:11:00:02

    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}

    ports:
      # NapCat WebUI
      - "6099:6099"

      # NapCat 相关端口，官方示例也暴露了 3000/3001/6099
      - "3000:3000"
      - "3001:3001"

    volumes:
      # NapCat 配置持久化
      - ./napcat/config:/app/napcat/config

      # QQ 登录数据持久化
      - ./napcat/ntqq:/app/.config/QQ

      # NapCat 插件目录
      - ./napcat/plugins:/app/napcat/plugins

    # 让容器内可以用 host.docker.internal 访问宿主机
    # 你的 Python bot 跑在宿主机 8082 时，NapCat 里填：
    # ws://host.docker.internal:8082
    extra_hosts:
      - "host.docker.internal:host-gateway"